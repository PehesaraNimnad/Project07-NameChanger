<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project07 Name Change</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="overlay" class="hidden">
  <div id="panel">

    <!-- Header -->
    <div class="panel-header">
      <div class="header-left">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div>
          <h1>NAME CHANGE</h1>
          <span class="subtitle">ADMIN PANEL</span>
        </div>
      </div>
      <button id="closeBtn" title="Close (ESC)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-row">
        <div class="input-group" style="flex:1">
          <label>CITIZEN ID</label>
          <input type="text" id="searchCitizenId" placeholder="QBX-XXXXXX" maxlength="20" autocomplete="off"/>
        </div>
        <button class="btn-search" id="searchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          SEARCH
        </button>
      </div>
      <div id="searchStatus" class="search-status hidden"></div>
    </div>

    <!-- Divider -->
    <div class="section-divider">
      <span>OR SELECT ONLINE PLAYER</span>
    </div>

    <!-- Online Players List -->
    <div class="players-section">
      <div class="players-header">
        <span>ONLINE PLAYERS</span>
        <span id="playerCount" class="count-badge">0</span>
      </div>
      <div id="playerList" class="player-list">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 12h8M12 8v8"/>
          </svg>
          <p>Loading players...</p>
        </div>
      </div>
    </div>

    <!-- Edit Form -->
    <div id="editSection" class="edit-section hidden">
      <div class="edit-header">
        <div class="edit-badge">EDITING</div>
        <span id="editCitizenDisplay" class="edit-citizen">—</span>
      </div>
      <div class="form-row">
        <div class="input-group">
          <label>FIRST NAME</label>
          <input type="text" id="inputFirst" placeholder="Enter first name" maxlength="30" autocomplete="off"/>
        </div>
        <div class="input-group">
          <label>LAST NAME</label>
          <input type="text" id="inputLast" placeholder="Enter last name" maxlength="30" autocomplete="off"/>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-cancel" id="cancelEdit">CANCEL</button>
        <button class="btn-apply" id="applyBtn">
          <span id="applyText">APPLY CHANGE</span>
          <div id="applyLoader" class="loader hidden"></div>
        </button>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <div class="toast-icon"></div>
      <span id="toastMsg"></span>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
